<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23d8ff4f' stroke='%23171713' stroke-width='3'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Arial' font-size='28' font-weight='900' fill='%23171713'%3EG%3C/text%3E%3C/svg%3E">
  <meta name="description" content="Gina AI Atlas：经过筛选和核验的 AI 工具导航。">
  <title>Gina AI Atlas｜精选 AI 工具导航</title>
  <style>
    :root {
      --paper: #f3efe6;
      --paper-deep: #e8e1d4;
      --ink: #171713;
      --muted: #6e6a61;
      --line: rgba(23, 23, 19, .15);
      --acid: #d8ff4f;
      --blue: #3d52ff;
      --coral: #ff6b55;
      --white: #fffdf8;
      --shadow: 0 20px 60px rgba(42, 38, 29, .10);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 23, 19, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 23, 19, .035) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      font-family: "Avenir Next", Avenir, "PingFang SC", "Hiragino Sans GB", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--line);
      background: rgba(243, 239, 230, .92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .header-main {
      max-width: 1440px;
      min-height: 74px;
      margin: 0 auto;
      padding: 12px 28px;
      display: grid;
      grid-template-columns: 220px minmax(260px, 620px) 48px;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      background: var(--acid);
      font-weight: 900;
      transform: rotate(-7deg);
    }
    .brand-copy strong { display: block; font-size: 15px; letter-spacing: .02em; }
    .brand-copy small { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); opacity: .55; }
    .search-input {
      width: 100%;
      height: 48px;
      padding: 0 52px 0 45px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      outline: none;
      background: var(--white);
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .18s, box-shadow .18s;
    }
    .search-input:focus { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
    .search-key {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      font-size: 11px;
    }
    .header-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .icon-btn {
      min-height: 42px;
      border: 1px solid var(--ink);
      background: var(--white);
      cursor: pointer;
      transition: transform .18s, background .18s;
    }
    .icon-btn:hover { transform: translateY(-2px); background: var(--acid); }
    .icon-btn { width: 42px; border-radius: 50%; font-size: 17px; }

    .category-rail {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 28px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-rail::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex: 0 0 auto;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .filter-chip:hover { border-color: var(--ink); color: var(--ink); }
    .filter-chip.active { border-color: var(--ink); background: var(--ink); color: var(--paper); }

    main { max-width: 1440px; margin: 0 auto; padding: 0 28px 110px; }
    #home, #directory { scroll-margin-top: 135px; }
    .hero {
      min-height: auto;
      padding: 46px 0 32px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 560px);
      gap: 32px;
      align-items: center;
      border-bottom: 1px solid var(--ink);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 7px 11px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--acid);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
    h1 {
      max-width: 920px;
      margin: 0;
      font-family: "Iowan Old Style", "Songti SC", "STSong", serif;
      font-size: clamp(42px, 5vw, 72px);
      font-weight: 600;
      letter-spacing: -.045em;
      line-height: 1;
    }
    .hero-note { max-width: 560px; }
    .hero-note p { margin: 0 0 16px; color: #403d36; font-size: 15px; line-height: 1.75; }
    .hero-note strong { color: var(--ink); }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .meta-pill { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; background: rgba(255,253,248,.6); }

    .quick-strip {
      margin: 22px 0 42px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .quick-action { min-height: 78px; padding: 16px 18px; }
    .quick-action {
      border: 0;
      border-left: 1px solid var(--line);
      background: var(--white);
      cursor: pointer;
      text-align: left;
      transition: background .2s;
    }
    .quick-action:hover { background: var(--acid); }
    .quick-action:first-child { border-left: 0; }
    .quick-action span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 12px; }
    .quick-action strong { font-size: 14px; }

    .section-head {
      margin: 0 0 20px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }
    .section-kicker { display: block; margin-bottom: 6px; color: var(--blue); font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    h2 { margin: 0; font: 600 clamp(28px, 4vw, 48px)/1 "Iowan Old Style", "Songti SC", serif; letter-spacing: -.035em; }
    .result-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .tool-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .tool-card {
      position: relative;
      min-height: 265px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,253,248,.78);
      overflow: hidden;
      transition: transform .22s, box-shadow .22s, border-color .22s;
      animation: card-in .45s both;
    }
    .tool-card:hover { transform: translateY(-5px); border-color: var(--ink); box-shadow: 7px 7px 0 var(--ink); }
    @keyframes card-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .tool-mark {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 15px;
      background: var(--accent, var(--acid));
      font-size: 12px;
      font-weight: 900;
      letter-spacing: -.03em;
    }
    .fav-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      font-size: 17px;
    }
    .fav-btn:hover, .fav-btn.active { border-color: var(--ink); background: var(--acid); }
    .tool-card h3 { margin: 18px 0 7px; font-size: 20px; letter-spacing: -.025em; }
    .tool-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .tag-row { margin-top: auto; padding-top: 18px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 5px 8px; border-radius: 6px; background: var(--paper-deep); color: #504c44; font-size: 10px; font-weight: 700; }
    .tag.new { background: var(--coral); color: #fff; }
    .card-footer { margin-top: 14px; padding-top: 13px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
    .verified { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10px; }
    .verified::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #47a447; box-shadow: 0 0 0 3px rgba(71,164,71,.12); }
    .visit-link { text-decoration: none; font-size: 12px; font-weight: 900; }
    .visit-link:hover { color: var(--blue); }
    .empty-state { grid-column: 1 / -1; padding: 80px 20px; border: 1px dashed var(--muted); border-radius: var(--radius); text-align: center; }
    .empty-state strong { display: block; font: 600 28px/1.2 "Iowan Old Style", "Songti SC", serif; }
    .empty-state span { display: block; margin-top: 10px; color: var(--muted); }

    .site-footer { margin-top: 70px; padding: 28px 0; display: flex; justify-content: space-between; gap: 20px; border-top: 1px solid var(--ink); color: var(--muted); font-size: 11px; }
    .site-footer strong { color: var(--ink); }

    .toast { position: fixed; left: 50%; bottom: 28px; z-index: 140; transform: translate(-50%, 20px); padding: 11px 16px; border: 1px solid var(--ink); border-radius: 999px; background: var(--ink); color: var(--paper); opacity: 0; pointer-events: none; transition: .22s; font-size: 12px; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .mobile-nav { display: none; }

    @media (max-width: 1080px) {
      .header-main { grid-template-columns: 180px 1fr auto; }
      .brand-copy small { display: none; }
      .tool-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .quick-strip { grid-template-columns: repeat(4, 1fr); }
      .quick-action:first-of-type { border-left: 0; }
    }

    @media (max-width: 760px) {
      body { padding-bottom: calc(74px + env(safe-area-inset-bottom)); }
      .site-header { position: sticky; }
      .header-main { min-height: auto; padding: 11px 16px 9px; grid-template-columns: 1fr auto; gap: 10px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-copy strong { font-size: 14px; }
      .search-wrap { grid-column: 1 / -1; grid-row: 2; }
      .search-input { height: 43px; box-shadow: 2px 2px 0 var(--ink); }
      .search-key { display: none; }
      .header-actions .icon-btn { width: 36px; min-height: 36px; }
      .category-rail { padding: 0 16px 10px; }
      main { padding: 0 16px 80px; }
      #home, #directory { scroll-margin-top: 170px; }
      .hero { min-height: auto; padding: 28px 0 24px; display: block; }
      h1 { max-width: 350px; font-size: clamp(42px, 12vw, 56px); }
      .hero-note { padding-top: 20px; max-width: 100%; }
      .hero-note p { font-size: 14px; }
      .quick-strip { margin-top: 14px; grid-template-columns: repeat(2, 1fr); border-radius: 18px; }
      .quick-action { min-height: 78px; padding: 14px; border-top: 1px solid var(--line); }
      .quick-action:nth-of-type(odd) { border-left: 0; }
      .section-head { align-items: flex-start; }
      .tool-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .tool-card { min-height: 250px; padding: 14px; border-radius: 17px; }
      .tool-mark { width: 43px; height: 43px; border-radius: 12px; font-size: 10px; }
      .tool-card h3 { margin-top: 14px; font-size: 17px; }
      .tool-card p { font-size: 11px; line-height: 1.55; }
      .tag-row { padding-top: 13px; }
      .tag { font-size: 9px; }
      .site-footer { display: block; line-height: 1.8; }
      .mobile-nav {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        z-index: 60;
        padding: 7px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border: 1px solid var(--ink);
        border-radius: 18px;
        background: rgba(23,23,19,.94);
        backdrop-filter: blur(14px);
      }
      .mobile-nav button { padding: 7px 3px; border: 0; border-radius: 12px; background: transparent; color: var(--paper); font-size: 10px; cursor: pointer; }
      .mobile-nav button span { display: block; margin-bottom: 2px; font-size: 17px; }
      .mobile-nav button:active { background: rgba(255,255,255,.12); }
    }

    @media (max-width: 410px) {
      .tool-grid { grid-template-columns: 1fr; }
      .tool-card { min-height: 230px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <button class="brand" type="button" data-action="home" aria-label="返回首页">
        <span class="brand-mark">G</span>

    const TOOLS = [
      {id:"chatgpt",name:"ChatGPT",mark:"GPT",cat:"assistant",desc:"通用型 AI 助手，覆盖写作、分析、图像、代码与多步骤任务。",url:"https://chatgpt.com/",tags:["多模态","通用"],region:"global",price:"free",featured:true,color:"#d8ff4f"},

      {id:"yuanbao",name:"腾讯元宝",mark:"元",cat:"assistant",desc:"腾讯推出的 AI 助手，连接内容、文档与腾讯生态。",url:"https://yuanbao.tencent.com/",tags:["腾讯生态","文档"],region:"china",price:"free",isNew:true,color:"#bdf0df"},

      {id:"gemini-notebook",name:"Gemini Notebook",mark:"NB",cat:"research",desc:"原 NotebookLM，围绕自有资料进行研究、学习与内容整理。",url:"https://notebook.google.com/",tags:["资料研究","引用"],region:"global",price:"free",isNew:true,featured:true,color:"#8ed3ff"},
      {id:"perplexity",name:"Perplexity",mark:"PX",cat:"research",desc:"提供来源引用的 AI 搜索与深度研究工具。",url:"https://www.perplexity.ai/",tags:["联网搜索","引用"],region:"global",price:"free",color:"#b8ebe3"},

    ];

    const state = { category:"all", preset:"all", query:"", favorites:new Set(loadJSON("gina-favorites", [])) };
    const grid = document.getElementById("toolGrid");
    const title = document.getElementById("directoryTitle");
    const resultCount = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    const rail = document.getElementById("categoryRail");
    const toast = document.getElementById("toast");
    let toastTimer;

    function loadJSON(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
    function saveJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
    function escapeHTML(value) { return String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char])); }
    function showToast(message) { toast.textContent = message; toast.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 1800); }

    function renderCategories() {
      rail.innerHTML = Object.entries(CATEGORY).map(([key, label]) => {
        const count = key === "all" ? TOOLS.length : TOOLS.filter(tool => tool.cat === key).length;
        return `<button class="filter-chip ${state.category === key ? "active" : ""}" type="button" data-category="${key}">${label} · ${count}</button>`;
      }).join("");
    }

    function getFilteredTools() {
      const query = state.query.trim().toLowerCase();
      return TOOLS.filter(tool => {
        if (state.category !== "all" && tool.cat !== state.category) return false;
        if (state.preset === "new" && !tool.isNew) return false;
        if (state.preset === "china" && tool.region !== "china") return false;
        if (state.preset === "free" && tool.price !== "free") return false;
        if (state.preset === "favorites" && !state.favorites.has(tool.id)) return false;
        if (!query) return true;
        return [tool.name, tool.desc, CATEGORY[tool.cat], ...tool.tags].join(" ").toLowerCase().includes(query);
      }).sort((a, b) => Number(Boolean(b.featured)) - Number(Boolean(a.featured)) || Number(Boolean(b.isNew)) - Number(Boolean(a.isNew)) || a.name.localeCompare(b.name, "zh-CN"));
    }

    function renderTools() {
      const tools = getFilteredTools();
      const presetTitles = {all:state.category === "all" ? "全部工具" : CATEGORY[state.category],new:"最近更新",china:"国内可用",free:"可免费体验",favorites:"我的收藏"};
      title.textContent = state.query ? `搜索“${state.query}”` : presetTitles[state.preset];
      resultCount.textContent = `${tools.length} / ${TOOLS.length} 个工具`;
      if (!tools.length) {
        grid.innerHTML = `<div class="empty-state"><strong>这里暂时是空的</strong><span>换个关键词或筛选条件试试。</span></div>`;
        return;
      }
      grid.innerHTML = tools.map((tool, index) => `
        <article class="tool-card" style="--accent:${tool.color};animation-delay:${Math.min(index, 11) * 28}ms">
          <div class="card-top">
            <div class="tool-mark" aria-hidden="true">${escapeHTML(tool.mark)}</div>
            <button class="fav-btn ${state.favorites.has(tool.id) ? "active" : ""}" type="button" data-favorite="${tool.id}" aria-label="${state.favorites.has(tool.id) ? "取消收藏" : "收藏"}${escapeHTML(tool.name)}">${state.favorites.has(tool.id) ? "★" : "☆"}</button>
          </div>
          <h3>${escapeHTML(tool.name)}</h3>
          <p>${escapeHTML(tool.desc)}</p>
          <div class="tag-row">${tool.isNew ? '<span class="tag new">2026 新增</span>' : ""}${tool.tags.map(tag => `<span class="tag">${escapeHTML(tag)}</span>`).join("")}</div>
          <div class="card-footer"><span class="verified">已核验</span><a class="visit-link" href="${tool.url}" target="_blank" rel="noopener noreferrer" data-visit="${tool.id}">访问官网 ↗</a></div>
        </article>`).join("");
    }

    function applyPreset(preset) {
      state.preset = preset;
      state.category = "all";
      state.query = "";
      searchInput.value = "";
      renderCategories();
      renderTools();
      document.getElementById("directory").scrollIntoView({behavior:"smooth", block:"start"});
    }

    function toggleFavorite(id) {
      if (state.favorites.has(id)) state.favorites.delete(id); else state.favorites.add(id);
      saveJSON("gina-favorites", [...state.favorites]);
      renderTools();
      showToast(state.favorites.has(id) ? "已加入收藏" : "已取消收藏");
    }

    document.addEventListener("click", event => {
      const categoryButton = event.target.closest("[data-category]");
      const presetButton = event.target.closest("[data-preset]");
      const favoriteButton = event.target.closest("[data-favorite]");
      const actionButton = event.target.closest("[data-action]");
      const visitLink = event.target.closest("[data-visit]");
      if (categoryButton) { state.category = categoryButton.dataset.category; state.preset = "all"; renderCategories(); renderTools(); document.getElementById("directory").scrollIntoView({behavior:"smooth",block:"start"}); }
      if (presetButton) applyPreset(presetButton.dataset.preset);
      if (favoriteButton) toggleFavorite(favoriteButton.dataset.favorite);
      if (visitLink) { const recent = loadJSON("gina-recent", []).filter(id => id !== visitLink.dataset.visit); recent.unshift(visitLink.dataset.visit); saveJSON("gina-recent", recent.slice(0, 12)); }
      if (!actionButton) return;
      if (actionButton.dataset.action === "home") { state.category="all"; state.preset="all"; state.query=""; searchInput.value=""; renderCategories(); renderTools(); document.getElementById("home").scrollIntoView({behavior:"smooth"}); }
      if (actionButton.dataset.action === "favorites") applyPreset("favorites");
    });

    searchInput.addEventListener("input", () => { state.query = searchInput.value; state.category = "all"; state.preset = "all"; renderCategories(); renderTools(); });
    document.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); searchInput.focus(); }
    });

    document.getElementById("heroCount").textContent = TOOLS.length;
    renderCategories();
    renderTools();
  </script>
</body>
</html>
