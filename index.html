            scrollbar-width: none;
        }
        .scroll-row::-webkit-scrollbar { display: none; }

        .hot-card {

            text-decoration: none; color: inherit; transition: all 0.25s;
            position: relative; overflow: hidden;

        .hot-card .hot-desc { font-size: 0.8rem; color: #4a3f62; margin-top: 0.3rem; }

        .category-grid {

        }
        .category-entry {

        .category-entry .cat-count { font-size: 0.7rem; color: #9c97b8; }

        .card-grid {

        }

            return items.map(function(t){
                var has=t.link&&t.link.trim()!=="";
                var tag=has?"a":"div";
                var href=has?' href="'+t.link+'" target="_blank" rel="noopener"':'';
                var vh=has?'<span class="visit-hint">🔗 访问官网</span>':'';
                return "<"+tag+href+' class="card"><div class="logo-emoji">'+t.emoji+'</div><div class="tool-name">'+t.name+'</div><div class="tool-desc">'+t.desc+'</div><span class="feature-tag">'+t.feature+'</span>'+vh+"</"+tag+">";
            }).join("");
        }

        function ldCfg(){try{return JSON.parse(localStorage.getItem(BAL_KEY))||{};}catch(e){return{};}}
        function svCfg(c){localStorage.setItem(BAL_KEY,JSON.stringify(c));}

        function renderDashboard(){
            var cfg=ldCfg(),ct=document.getElementById("dashboardContent");
            if(!ct)return;
            var en=apiBalancePlatforms.filter(function(p){return cfg[p.id]&&cfg[p.id].enabled;});
            if(en.length===0){ct.innerHTML='<div class="empty-msg">点击导航栏「⚙️ 余额」添加你充值的 API 平台 💰</div>';return;}
            var h='<div class="dashboard-grid">';
            en.forEach(function(p){
                var bal=cfg[p.id].balance||0,lo=(bal<10&&bal>0)?" low":"",u=p.group==="国际"?"USD":"元";
                h+='<div class="balance-card"><div class="p-emoji">'+p.emoji+'</div><div class="p-name">'+p.name+'</div><div class="p-balance'+lo+'">'+bal.toFixed(2)+'</div><div class="p-unit">'+u+(lo?" · ⚠️余额不足":"")+'</div></div>';
            });
            h+='</div>';ct.innerHTML=h;
        }

        function renderConfigList(){
            var cfg=ldCfg(),ct=document.getElementById("configList"),h="";
            ["国内","国际"].forEach(function(g){
                var pl=apiBalancePlatforms.filter(function(p){return p.group===g;});
                h+='<div class="config-section"><div class="config-section-title">'+g+'平台</div>';
                pl.forEach(function(p){
                    var s=cfg[p.id]||{};
                    h+='<div class="config-item"><input type="checkbox" id="chk_'+p.id+'" '+(s.enabled?"checked":"")+'><div class="item-info"><span class="item-emoji">'+p.emoji+'</span><span class="item-name">'+p.name+'</span></div><input type="number" class="item-balance-input" id="bal_'+p.id+'" value="'+(s.balance||"")+'" placeholder="0.00" step="0.01" min="0"></div>';
                });
                h+='</div>';
            });
            ct.innerHTML=h;
        }

        window.openConfig=function(){renderConfigList();document.getElementById("configOverlay").classList.add("show");};
        window.closeConfig=function(){document.getElementById("configOverlay").classList.remove("show");};
        window.saveConfig=function(){
            var cfg={};

        window.toggleDash=function(){var c=document.getElementById("dashboardContent");if(!c)return;var h=c.style.display==="none";c.style.display=h?"":"none";localStorage.setItem(DASH_KEY,h?"1":"0");this.textContent=h?"👁️ 隐藏":"👁️ 显示";};
            apiBalancePlatforms.forEach(function(p){
                var ck=document.getElementById("chk_"+p.id),bl=document.getElementById("bal_"+p.id);
                if(ck&&ck.checked)cfg[p.id]={enabled:true,balance:parseFloat(bl.value)||0};
            });
            svCfg(cfg);renderDashboard();closeConfig();
        };

        document.getElementById("configOverlay").addEventListener("click",function(e){if(e.target===this)closeConfig();});

        buildNav();
        var sv=localStorage.getItem(CAT_KEY);
        if(sv&&sv!=="home"&&toolsData[sv])showCategory(sv);else showHome();

        var dv=localStorage.getItem(DASH_KEY);
        if(dv==="0")setTimeout(function(){var dc=document.getElementById("dashboardContent");if(dc)dc.style.display="none";},100);
    </script>
</body>
</html>
