    const state = {
      category: "all", preset: "all", query: "", onlyFavorites: false, tab: "tools",
      theme: localStorage.getItem("ginaai_theme") || "dark",
      favorites: new Set(loadFav()),
    };

    const toolsGrid = document.getElementById("toolsGrid");
    const learnContainer = document.getElementById("learnContainer");
    const catScroll = document.getElementById("catScroll");
    const searchInput = document.getElementById("searchInput");
    const searchClearBtn = document.getElementById("searchClearBtn");
    const resultsCount = document.getElementById("resultsCount");
    const favFilterBtn = document.getElementById("favFilterBtn");
    const favCountBadge = document.getElementById("favCountBadge");
    const favHeartIcon = document.getElementById("favHeartIcon");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const themeIcon = document.getElementById("themeIcon");
    const themeLabel = document.getElementById("themeLabel");
    const brandBtn = document.getElementById("brandBtn");
    const toast = document.getElementById("toast");
    let toastTimer;

    function applyTheme(t) {
      state.theme = t;
      document.documentElement.setAttribute("data-theme", t);
      localStorage.setItem("ginaai_theme", t);
      themeIcon.textContent = t === "light" ? "🌙" : "☀️";
      themeLabel.textContent = t === "light" ? "暗色" : "亮色";
    }
    applyTheme(state.theme);

    themeToggleBtn.addEventListener("click", () => {
      const next = state.theme === "light" ? "dark" : "light";
      applyTheme(next);
      showToast(next === "light" ? "☀️ 已切换为明朗亮色版" : "🌙 已切换为赛博暗色版");
    });

    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll(".tab-btn, .tab-mobile-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      document.querySelectorAll(".page-section").forEach(s => s.classList.toggle("active", s.id === "tab-" + tab));
      searchInput.placeholder = tab === "learn" ? "搜索免费 AI 课程、机构（如 吴恩达、MCP、Stanford）..." : "搜索 AI 工具、用途（如 PPT、会议、音乐）...";
      if (tab === "learn") renderLearn();
      else renderTools();
    }
    document.querySelectorAll(".tab-btn, .tab-mobile-btn").forEach(btn => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));

    function loadFav() {
      try { return JSON.parse(localStorage.getItem("ginaai_favs_v2") || "[]"); } catch(e) { return []; }
    }
    function saveFav() {
      localStorage.setItem("ginaai_favs_v2", JSON.stringify([...state.favorites]));
      updateFavBadge();
    }
    function updateFavBadge() {
      const n = state.favorites.size;
      favCountBadge.textContent = `(${n})`;
      favFilterBtn.classList.toggle("active", state.onlyFavorites);
      favHeartIcon.textContent = state.onlyFavorites ? "💖" : n > 0 ? "❤️" : "🤍";
    }
    function showToast(msg) {
      toast.textContent = msg; toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }
    function esc(str) {
      return String(str).replace(/[&<>'"]/g, t => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[t]||t));
    }

    function renderCategories() {
      catScroll.innerHTML = Object.entries(CATEGORIES).map(([key, item]) => {
        const count = key === "all" ? TOOLS_DATA.length : TOOLS_DATA.filter(t => t.cat === key).length;
        return `<button class="cat-pill${state.category===key?" active":""}" data-cat="${key}" type="button">
          <span>${item.icon}</span><span>${item.label}</span><span class="cat-count">${count}</span>
        </button>`;
      }).join("");
      catScroll.querySelectorAll(".cat-pill").forEach(btn => btn.addEventListener("click", () => {
        state.category = btn.dataset.cat; state.onlyFavorites = false;
        renderCategories(); renderTools();
      }));
    }

    function getFilteredTools() {
      const q = state.query.trim().toLowerCase();
      return TOOLS_DATA.filter(t => {
        if (state.category !== "all" && t.cat !== state.category) return false;
        if (state.onlyFavorites && !state.favorites.has(t.id)) return false;
        if (state.preset === "vpn"   && t.region !== "global") return false;
        if (state.preset === "china" && t.region !== "china")  return false;
        if (state.preset === "free"  && t.price  !== "free")   return false;
        if (state.preset === "new"   && !t.isNew)              return false;
        if (!q) return true;
        return [t.name, t.id, t.desc || "", (t.tags || []).join(" "), CATEGORIES[t.cat]?.label || ""].join(" ").toLowerCase().includes(q);
      });
    }

    function renderTools() {
      const tools = getFilteredTools();
      resultsCount.textContent = tools.length;
      if (!tools.length) {
        toolsGrid.innerHTML = `<div class="empty-box"><div class="empty-emoji">🫧</div><h3>没找到匹配的 AI 工具</h3><p>试试搜索“PPT”、“会议”、“生图”、“音乐”或清空筛选条件</p><button class="btn-reset" id="resetBtn" type="button">🔄 查看全部</button></div>`;
        document.getElementById("resetBtn")?.addEventListener("click", resetAll);
        return;
      }
      toolsGrid.innerHTML = tools.map(t => {
        const isFav = state.favorites.has(t.id);
        return `
          <a class="tool-card${t.isNew?" is-new":""}" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" title="${esc(t.name)} — ${esc(t.desc)}">
            <span class="fav-heart-btn${isFav?" active":""}" role="button" tabindex="0" data-id="${t.id}" aria-label="收藏 ${esc(t.name)}">${isFav?"❤️":"🤍"}</span>
            ${t.isNew?'<span class="new-badge">NEW</span>':""}
            <div class="emoji-logo-box" style="--card-tint:${t.tint}">${t.emoji}</div>
            <div class="tool-name">${esc(t.name)}</div>
            <div class="tool-desc">${esc(t.desc)}</div>
            <div class="tool-meta-row">
              <span class="network-badge ${t.region==="global"?"vpn":"china"}">${t.region==="global"?"🌐 VPN":"🇨🇳 直连"}</span>
              <span class="price-text ${t.price==="free"?"free":""}">· ${t.price==="free"?"免费":"付费"}</span>
            </div>
          </a>`;
      }).join("");
    }

    function renderLearn() {
      const q = state.query.trim().toLowerCase();
      const filtered = LEARN_DATA.filter(c => {
        if (!q) return true;
        return [c.title, c.provider, c.desc, c.domainLabel, c.badges.map(b => b.text).join(" ")].join(" ").toLowerCase().includes(q);
      });
      if (!filtered.length) {
        learnContainer.innerHTML = `<div class="empty-box"><div class="empty-emoji">📚</div><h3>没找到匹配的免费学习资源</h3><p>试试其他关键词或清空搜索框</p><button class="btn-reset" id="resetLearnBtn" type="button">🔄 显示全部课程</button></div>`;
        document.getElementById("resetLearnBtn")?.addEventListener("click", resetAll);
        return;
      }
      const sections = [
        { key: "beginner", label: "🌱 零基础与官方学院", badgeClass: "badge-beginner" },
        { key: "advanced", label: "🚀 进阶实战与名校公开课", badgeClass: "badge-advanced" },
        { key: "chinese",  label: "🇨🇳 中文社区精选（国内直连）", badgeClass: "badge-free" }
      ];
      learnContainer.innerHTML = sections.map(sec => {
        const items = filtered.filter(c => c.section === sec.key);
        if (!items.length) return "";
        return `
          <div class="learn-section-header">
            <span class="learn-section-tag ${sec.badgeClass}">${sec.label}</span>
            <div style="flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)"></div>
          </div>
          <div class="learn-grid">
            ${items.map(c => `
              <a class="learn-card" style="--card-accent:${c.accent}" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">
                <div class="learn-card-top">
                  <div class="learn-logo">${c.emoji}</div>
                  <div class="learn-badges">
                    <span class="network-badge ${c.region==="global"?"vpn":"china"}">${c.region==="global"?"🌐 VPN":"🇨🇳 直连"}</span>
                    ${c.badges.map(b => `<span class="learn-badge badge-${b.type}">${esc(b.text)}</span>`).join("")}
                  </div>
                </div>
                <div>
                  <div class="learn-title">${esc(c.title)}</div>
                  <div class="learn-provider">${esc(c.provider)}</div>
                </div>
                <div class="learn-desc">${esc(c.desc)}</div>
                <div class="learn-meta"><span>${esc(c.domainLabel)}</span><span class="learn-arrow">→</span></div>
              </a>
            `).join("")}
          </div>
        `;
      }).join("");
    }

    function resetAll() {
      state.category="all"; state.preset="all"; state.query=""; state.onlyFavorites=false; searchInput.value="";
      searchClearBtn.style.display = "none";
      document.querySelectorAll(".filter-chip").forEach(p => p.classList.toggle("active", p.dataset.preset==="all"));
      updateFavBadge(); renderCategories(); renderTools(); renderLearn();
    }

    toolsGrid.addEventListener("click", e => {
      const btn = e.target.closest(".fav-heart-btn");
      if (!btn) return;
      e.preventDefault(); e.stopPropagation();
      const id = btn.dataset.id, tool = TOOLS_DATA.find(t => t.id === id);
      if (state.favorites.has(id)) {
        state.favorites.delete(id); btn.classList.remove("active"); btn.textContent="🤍";
        showToast(`💔 已移除 ${tool?.name||""}`);
      } else {
        state.favorites.add(id); btn.classList.add("active"); btn.textContent="❤️";
        showToast(`❤️ 已收藏 ${tool?.name||""}`);
      }
      saveFav(); if (state.onlyFavorites) renderTools();
    });

    document.querySelectorAll(".filter-chip").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active"); state.preset = btn.dataset.preset; renderTools();
    }));

    let searchT = null;
    searchInput.addEventListener("input", e => {
      searchClearBtn.style.display = e.target.value ? "inline-block" : "none";
      clearTimeout(searchT);
      searchT = setTimeout(() => {
        state.query = e.target.value;
        if (state.tab === "learn") renderLearn();
        else renderTools();
      }, 100);
    });
    searchClearBtn.addEventListener("click", () => {
      searchInput.value = ""; state.query = ""; searchClearBtn.style.display = "none";
      searchInput.focus();
      if (state.tab === "learn") renderLearn(); else renderTools();
    });

    window.addEventListener("keydown", e => {
      if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k") {
        e.preventDefault(); searchInput.focus(); searchInput.select();
      }
      if (e.key==="Escape" && document.activeElement===searchInput) searchInput.blur();
    });

    favFilterBtn.addEventListener("click", () => {
      if (state.tab !== "tools") switchTab("tools");
      state.onlyFavorites = !state.onlyFavorites;
      if (state.onlyFavorites && !state.favorites.size) showToast("🤍 还没有收藏～点卡片左上角的小心心即可收藏");
      updateFavBadge(); renderTools();
    });

    brandBtn.addEventListener("click", () => {
      resetAll(); switchTab("tools");
      window.scrollTo({top:0, behavior:"smooth"});
    });

    document.getElementById("statTotalCount").textContent = TOOLS_DATA.length;
    document.getElementById("statCatCount").textContent = Object.keys(CATEGORIES).length - 1;
    updateFavBadge(); renderCategories(); renderTools(); renderLearn();
  </script>
